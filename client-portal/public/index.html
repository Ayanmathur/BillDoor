<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BillDoor — Smart Billing & Reviews</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #111111;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .loader {
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top: 3px solid #088395;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <h2>Loading BillDoor Desktop...</h2>
    <script>
      window.location.href = 'https://app.billdoor.in/dashboard';
    </script>
  </body>
</html>
